name: zebu_call_tracker
description: "Zebu Call Tracker - logs employees' work calls and sends them to Zebu CRM."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  dio: ^5.11.0
  flutter_secure_storage: 10.3.1
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  path: ^1.9.0
  permission_handler: 12.0.1
  # Local database. drift/drift_dev are PINNED as an exact pair and must be
  # bumped together. The window is narrow on Flutter 3.38.6:
  #   - drift_dev >=2.34.2 requires meta ^1.18.0, but the Flutter SDK pins
  #     meta 1.17.0 -> unresolvable.
  #   - drift <2.32 pairs with sqlite3 2.x, so drift_flutter (needs sqlite3
  #     3.x) is out. The app runs drift on drift_sqflite instead (below).
  # 2.28.0 is the newest pair that satisfies both ends. Re-evaluate after a
  # Flutter SDK upgrade raises the pinned `meta` version.
  drift: 2.28.0
  # Pinned only because drift 2.28 pairs with sqlite3 2.x (see above). The app
  # itself never opens a database through it: see the sqflite note below.
  sqlite3: ^2.9.4
  uuid: ^4.6.0
  # Recording playback. ExoPlayer underneath, which resolves content:// URIs
  # directly, so MediaStore audio plays without copying the file out first.
  just_audio: ^0.10.6
  flutter_local_notifications: ^18.0.1
  # Drift runs on Android's built-in SQLite through sqflite. The Kotlin
  # uploader opens the same zebu_calls.sqlite through that same SQLite;
  # bundling a second copy (sqlite3_flutter_libs + NativeDatabase) put two
  # SQLite libraries on one file in one process, which corrupted it. Do not
  # bring the bundled library back — see AppDatabase._openConnection.
  drift_sqflite: ^2.0.1
  sqflite: ^2.4.2+1
  # Background scheduling is native (androidx.work in android/app), so there
  # is no Dart workmanager plugin here.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.28.0 # pinned in lockstep with `drift` above
  build_runner: ^2.5.4
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.7+1

flutter:
  uses-material-design: true

  assets:
    # IBM Plex Sans's SIL OFL licence, registered with LicenseRegistry in
    # main.dart.
    - assets/fonts/LICENSE.txt

  # IBM Plex Sans is bundled rather than fetched at runtime: the app is used
  # on field networks, and a runtime fetch rendered the first launch in a
  # fallback font and then re-laid out every screen once the download landed.
  # The native post-call card loads the same files from flutter_assets, so
  # renaming or moving them breaks it too (PostCallOverlayController).
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
